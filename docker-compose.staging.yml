version: '3.8'

# Staging Docker Compose Configuration
# Usage: docker-compose -f docker-compose.staging.yml up -d
# This is for STAGING validation - not production, not development

services:
  # PostgreSQL Database (Staging)
  postgres:
    image: postgres:15-alpine
    container_name: attendai_postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendai_staging_db}
      POSTGRES_USER: ${POSTGRES_USER:-attendai_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./scripts/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendai_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - attendai_staging_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis Cache & Queue (Staging - separate DB)
  redis:
    image: redis:7-alpine
    container_name: attendai_redis_staging
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - attendai_staging_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # FastAPI Backend (Staging)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendai_backend_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - APP_ENV=staging
      - DEBUG=false
    ports:
      - "8001:8000"  # Different port to avoid conflicts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendai_staging_network
    command: /app/scripts/start.sh uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # RQ Worker (Staging)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendai_worker_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - APP_ENV=staging
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendai_staging_network
    command: python -m app.worker --queues calls,retries,campaigns,followups
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Next.js Frontend (Staging)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: attendai_frontend_staging
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-AttendAI Staging}
      - NODE_ENV=production
    ports:
      - "3001:3000"  # Different port to avoid conflicts
    depends_on:
      - backend
    networks:
      - attendai_staging_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  attendai_staging_network:
    driver: bridge
