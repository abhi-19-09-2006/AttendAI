[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --cov=app
    --cov-report=html
    --cov-report=term-missing
asyncio_mode = auto

[tool:pytest]
env =
    DATABASE_URL=postgresql+asyncpg://attendai:attendai_dev_password@localhost:5432/attendai_db
