version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: attendai_postgres
    environment:
      POSTGRES_DB: attendai_db
      POSTGRES_USER: attendai
      POSTGRES_PASSWORD: attendai_dev_password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendai_network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: attendai_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - attendai_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendai_backend
    environment:
      - DATABASE_URL=postgresql://attendai:attendai_dev_password@postgres:5432/attendai_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendai_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # RQ Worker for Background Jobs
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendai_worker
    environment:
      - DATABASE_URL=postgresql://attendai:attendai_dev_password@postgres:5432/attendai_db
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendai_network
    command: python -m app.worker --queues calls,retries,campaigns,followups

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: base
    container_name: attendai_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=AttendAI
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - attendai_network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  attendai_network:
    driver: bridge
