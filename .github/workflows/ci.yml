name: CI

on:
  push:
    branches: [main, arena/**]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: attendai_test_db
          POSTGRES_USER: attendai
          POSTGRES_PASSWORD: attendai_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov alembic
      
      - name: Run Alembic migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://attendai:attendai_test_password@localhost:5432/attendai_test_db
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          DEBUG: false
        run: |
          alembic upgrade head
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://attendai:attendai_test_password@localhost:5432/attendai_test_db
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          DEBUG: false
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          VAPI_API_KEY: test-vapi-key
          VAPI_WEBHOOK_SECRET: test-webhook-secret
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run linter
        working-directory: ./frontend
        run: npm run lint
      
      - name: Run type checking
        working-directory: ./frontend
        run: npm run type-check
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: attendai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: attendai-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Validate docker-compose
        run: |
          docker-compose config
          echo "✓ docker-compose.yml is valid"

  migration-check:
    name: Migration Consistency Check
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: attendai_migration_test
          POSTGRES_USER: attendai
          POSTGRES_PASSWORD: attendai_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install alembic
      
      - name: Check migration chain
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://attendai:attendai_test_password@localhost:5432/attendai_migration_test
        run: |
          # Verify migration chain is intact
          alembic history --verbose
          echo "✓ Migration history is valid"
          
          # Verify we can upgrade to head
          alembic upgrade head
          echo "✓ Successfully upgraded to head"
          
          # Verify current revision
          CURRENT=$(alembic current)
          echo "Current revision: $CURRENT"
          
          # Verify we can downgrade and upgrade again
          alembic downgrade -1
          alembic upgrade head
          echo "✓ Downgrade and upgrade cycle works"
